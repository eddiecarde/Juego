; Preset de exportación Android preconfigurado para "Goods Sort Master".
;
; Para exportar necesitas:
;   1. Instalar los Export Templates de tu versión de Godot
;      (Editor > Gestionar plantillas de exportación).
;   2. Configurar el Android SDK / JDK en
;      Editor > Configuración del editor > Export > Android.
;   3. Generar un keystore de depuración/lanzamiento y ponerlo en las
;      variables de entorno o en Configuración del editor (no lo subas al repo).
;
; package/unique_name debe ser único en Google Play.

[preset.0]

name="Android"
platform="Android"
runnable=true
advanced_options=false
dedicated_server=false
custom_features=""
export_filter="all_resources"
include_filter=""
exclude_filter=""
export_path="build/goods_sort_master.apk"
patches=PackedStringArray()
encryption_include_filters=""
encryption_exclude_filters=""
seed=0
encrypt_pck=false
encrypt_directory=false
script_export_mode=2

[preset.0.options]

gradle_build/use_gradle_build=true
gradle_build/gradle_build_directory=""
gradle_build/android_source_template=""
gradle_build/compress_native_libraries=false
gradle_build/export_format=0
gradle_build/min_sdk=""
gradle_build/target_sdk=""
architectures/armeabi-v7a=false
architectures/arm64-v8a=true
architectures/x86=false
architectures/x86_64=false
version/code=1
version/name="1.0"
package/unique_name="com.example.goodssortmaster"
package/name="Goods Sort Master"
package/signed=true
package/app_category=2
package/retain_data_on_uninstall=false
package/exclude_from_recents=false
launcher_icons/main_192x192=""
launcher_icons/adaptive_foreground_432x432=""
launcher_icons/adaptive_background_432x432=""
screen/immersive_mode=true
screen/support_small=true
screen/support_normal=true
screen/support_large=true
screen/support_xlarge=true
user_data_backup/allow=false
command_line/extra_args=""
apk_expansion/enable=false
permissions/internet=true
permissions/access_network_state=true
